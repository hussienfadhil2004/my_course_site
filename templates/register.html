{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2>إنشاء حساب جديد</h2>
        <form method="POST">
            <div class="mb-3"><input class="form-control" name="full_name" placeholder="الاسم الثلاثي" required></div>
            <div class="mb-3"><input class="form-control" name="username" placeholder="اسم المستخدم" required></div>
            <div class="mb-3"><input class="form-control" name="email_or_phone" placeholder="البريد الإلكتروني أو الهاتف" required></div>
            <div class="mb-3"><input class="form-control" type="password" name="password" placeholder="كلمة المرور" required></div>
            <button class="btn btn-success w-100">تسجيل</button>
        </form>
    </div>
</div>
{% endblock %}
