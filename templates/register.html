{% extends "base.html" %}

{% block title %}إنشاء حساب{% endblock %}

{% block content %}
<div class="row justify-content-center min-vh-75 align-items-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-lg border-0 rounded-4 p-4">
            <div class="text-center mb-4">
                <i class="fas fa-user-plus fa-3x text-success"></i>
                <h3 class="mt-2 fw-bold">انضم إلينا</h3>
                <p class="text-muted">أنشئ حسابك وابدأ رحلة التعلم</p>
            </div>
            <form method="POST">
                <div class="row">
                    <div class="col-md-12 mb-3">
                        <label class="form-label fw-semibold"><i class="fas fa-user me-2"></i>الاسم الثلاثي</label>
                        <input type="text" class="form-control form-control-lg" name="full_name" placeholder="أحمد محمد علي" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold"><i class="fas fa-envelope me-2"></i>البريد الإلكتروني</label>
                        <input type="email" class="form-control form-control-lg" name="email" placeholder="example@mail.com" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold"><i class="fas fa-phone me-2"></i>رقم الهاتف (اختياري)</label>
                        <input type="text" class="form-control form-control-lg" name="phone" placeholder="05XXXXXXXX">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold"><i class="fas fa-lock me-2"></i>كلمة المرور</label>
                        <input type="password" class="form-control form-control-lg" name="password" placeholder="6 أحرف على الأقل" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold"><i class="fas fa-check-circle me-2"></i>تأكيد كلمة المرور</label>
                        <input type="password" class="form-control form-control-lg" name="confirm_password" placeholder="أعد كتابتها" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-success btn-lg w-100 fw-bold">
                    <i class="fas fa-user-check me-2"></i>إنشاء الحساب
                </button>
            </form>
            <hr class="my-3">
            <p class="text-center mb-0">لديك حساب؟ <a href="{{ url_for('login') }}" class="text-primary fw-bold">تسجيل الدخول</a></p>
        </div>
    </div>
</div>
{% endblock %}
