{% extends "base.html" %}
{% block title %}الملف الشخصي{% endblock %}
{% block content %}
<div class="profile-container">
    <h2><i class="fas fa-user-circle"></i> الملف الشخصي</h2>
    <div class="profile-info">
        <div class="profile-item">
            <label>اسم المستخدم</label>
            <p>{{ user.username }}</p>
        </div>
        <div class="profile-item">
            <label>الاسم الثلاثي (الحقيقي)</label>
            <p>{{ user.full_name }}</p>
        </div>
        <div class="profile-item">
            <label>البريد الإلكتروني</label>
            <p>{{ user.email or 'غير مضاف' }}</p>
        </div>
        <div class="profile-item">
            <label>رقم الهاتف</label>
            <p>{{ user.phone or 'غير مضاف' }}</p>
        </div>
    </div>
</div>
{% endblock %}
