{% extends "base.html" %}
{% block content %}
<h2>الملف الشخصي</h2>
<form method="POST" enctype="multipart/form-data">
    <div class="row">
        <div class="col-md-4 text-center">
            <img src="{{ url_for('static', filename='uploads/'+user.profile_pic) }}" class="rounded-circle mb-2" width="120">
            <input type="file" name="profile_pic" class="form-control">
        </div>
        <div class="col-md-8">
            <div class="mb-3"><label>الاسم</label><input class="form-control" value="{{ user.full_name }}" disabled></div>
            <div class="mb-3"><label>المعرف الدراسي</label><input class="form-control" value="{{ user.student_id }}" disabled></div>
            <div class="mb-3"><label>السيرة الذاتية</label><textarea name="bio" class="form-control">{{ user.bio }}</textarea></div>
            <div class="mb-3"><label>رابط تيليجرام</label><input name="telegram" class="form-control" value="{{ user.telegram_link }}"></div>
            <div class="mb-3"><label>رابط واتساب</label><input name="whatsapp" class="form-control" value="{{ user.whatsapp_link }}"></div>
            <div class="form-check mb-3"><input class="form-check-input" type="checkbox" name="show_real_name" {% if user.show_real_name %}checked{% endif %}><label>إظهار الاسم الحقيقي للعامة</label></div>
            <div class="mb-3"><label>الحالة</label><select name="status" class="form-control"><option value="متصل" {% if user.status=='متصل' %}selected{% endif %}>متصل</option><option value="أدرس الآن" {% if user.status=='أدرس الآن' %}selected{% endif %}>أدرس الآن</option></select></div>
            <button class="btn btn-primary">حفظ</button>
        </div>
    </div>
</form>
{% endblock %}
