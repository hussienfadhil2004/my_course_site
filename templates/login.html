{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h2 class="mb-3">تسجيل الدخول</h2>
        <form method="POST">
            <div class="mb-3"><input class="form-control" name="username" placeholder="اسم المستخدم" required></div>
            <div class="mb-3"><input class="form-control" type="password" name="password" placeholder="كلمة المرور" required></div>
            <button class="btn btn-primary w-100">دخول</button>
        </form>
        <div class="mt-3 text-center">
            <a href="/forgot-username">نسيت اسم المستخدم؟</a> | 
            <a href="/forgot-password">نسيت كلمة المرور؟</a>
        </div>
    </div>
</div>
{% endblock %}
