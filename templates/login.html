{% extends "base.html" %}

{% block title %}تسجيل الدخول{% endblock %}

{% block content %}
<div class="row justify-content-center min-vh-75 align-items-center">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow-lg border-0 rounded-4 p-4" style="backdrop-filter: blur(10px); background: rgba(255,255,255,0.9);">
            <div class="text-center mb-4">
                <i class="fas fa-graduation-cap fa-3x text-primary"></i>
                <h3 class="mt-2 fw-bold">مرحباً بعودتك</h3>
                <p class="text-muted">سجل دخولك للوصول إلى دوراتك</p>
            </div>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold"><i class="fas fa-envelope me-2"></i>البريد الإلكتروني أو رقم الهاتف</label>
                    <input type="text" class="form-control form-control-lg" name="email_or_phone" placeholder="example@mail.com أو 05XXXXXXXX" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold"><i class="fas fa-lock me-2"></i>كلمة المرور</label>
                    <input type="password" class="form-control form-control-lg" name="password" placeholder="••••••••" required>
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="remember" name="remember">
                    <label class="form-check-label" for="remember">تذكرني</label>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">
                    <i class="fas fa-sign-in-alt me-2"></i>دخول
                </button>
            </form>
            <hr class="my-4">
            <div class="text-center">
                <p class="mb-2">ليس لديك حساب؟ <a href="{{ url_for('register') }}" class="text-primary fw-bold">إنشاء حساب جديد</a></p>
                <small><a href="#" class="text-muted text-decoration-none">نسيت كلمة المرور؟</a></small>
            </div>
        </div>
        <div class="text-center mt-3">
            <small class="text-muted">الدخول كمسؤول: admin@mycourse.com / admin123</small>
        </div>
    </div>
</div>
{% endblock %}
