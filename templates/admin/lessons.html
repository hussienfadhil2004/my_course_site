{% extends "admin/admin_base.html" %}

{% block admin_content %}
<h4 class="fw-bold mb-4"><i class="fas fa-book me-2 text-primary"></i>إدارة الدروس</h4>

<div class="card shadow-sm mb-4">
    <div class="card-body">
        <h5>إضافة درس جديد</h5>
        <form method="POST" action="{{ url_for('admin_lessons') }}">
            <div class="row g-2">
                <div class="col-md-3"><input class="form-control" name="title" placeholder="العنوان" required></div>
                <div class="col-md-3"><input class="form-control" name="description" placeholder="الوصف المختصر"></div>
                <div class="col-md-3"><input class="form-control" name="youtube_url" placeholder="رابط يوتيوب (Embed)"></div>
                <div class="col-md-3">
                    <select class="form-select" name="category_id">
                        <option value="">-- بدون تصنيف --</option>
                        {% for c in categories %}
                        <option value="{{ c.id }}">{{ c.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-12">
                    <textarea class="form-control" name="content" rows="3" placeholder="المحتوى النصي للدرس (يمكن استخدام HTML)"></textarea>
                </div>
                <div class="col-md-2"><input class="form-control" name="order" type="number" placeholder="الترتيب" value="0"></div>
                <div class="col-md-2"><div class="form-check mt-2"><input class="form-check-input" type="checkbox" name="is_published" checked> <label>منشور</label></div></div>
                <div class="col-md-2"><button class="btn btn-success w-100" type="submit">إضافة</button></div>
            </div>
        </form>
        <small class="text-muted">يمكنك استخدام HTML داخل المحتوى النصي لتنسيق النص.</small>
    </div>
</div>

<div class="list-group">
    {% for l in lessons %}
    <div class="list-group-item">
        <form method="POST" action="{{ url_for('admin_edit_lesson', lesson_id=l.id) }}" class="row g-2 align-items-start">
            <div class="col-md-2"><input class="form-control form-control-sm" name="title" value="{{ l.title }}" required></div>
            <div class="col-md-2"><input class="form-control form-control-sm" name="description" value="{{ l.description or '' }}"></div>
            <div class="col-md-2"><input class="form-control form-control-sm" name="youtube_url" value="{{ l.youtube_url or '' }}"></div>
            <div class="col-md-2">
                <select class="form-select form-select-sm" name="category_id">
                    <option value="">-- بدون --</option>
                    {% for c in categories %}
                    <option value="{{ c.id }}" {% if l.category_id == c.id %}selected{% endif %}>{{ c.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-12">
                <textarea class="form-control form-control-sm" name="content" rows="2">{{ l.content or '' }}</textarea>
            </div>
            <div class="col-md-1"><input class="form-control form-control-sm" name="order" type="number" value="{{ l.order or 0 }}"></div>
            <div class="col-md-1"><input class="form-check-input" type="checkbox" name="is_published" {% if l.is_published %}checked{% endif %}></div>
            <div class="col-md-2">
                <button class="btn btn-sm btn-primary" type="submit">تعديل</button>
                <button type="button" class="btn btn-sm btn-danger" onclick="if(confirm('حذف الدرس نهائياً؟')) document.getElementById('del-{{ l.id }}').submit();">حذف</button>
                <form id="del-{{ l.id }}" method="POST" action="{{ url_for('admin_delete_lesson', lesson_id=l.id) }}" style="display:none;"></form>
            </div>
        </form>
    </div>
    {% endfor %}
</div>
{% endblock %}
