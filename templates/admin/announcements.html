{% extends "admin/admin_base.html" %}

{% block admin_content %}
<h4 class="fw-bold mb-4"><i class="fas fa-bullhorn me-2 text-primary"></i>إدارة الإعلانات</h4>

<div class="card shadow-sm mb-4">
    <div class="card-body">
        <h5>إضافة إعلان جديد</h5>
        <form method="POST" action="{{ url_for('admin_announcements') }}">
            <div class="row g-2">
                <div class="col-md-4"><input class="form-control" name="title" placeholder="عنوان الإعلان" required></div>
                <div class="col-md-6"><input class="form-control" name="content" placeholder="محتوى الإعلان" required></div>
                <div class="col-md-2"><button class="btn btn-success w-100" type="submit">نشر</button></div>
            </div>
        </form>
    </div>
</div>

<div class="list-group">
    {% for ann in announcements %}
    <div class="list-group-item d-flex justify-content-between align-items-center">
        <div>
            <h6 class="mb-1">{{ ann.title }}</h6>
            <small class="text-muted">{{ ann.content }}</small>
            <br>
            <small class="text-muted">نشر في: {{ ann.created_at.strftime('%Y-%m-%d %H:%M') }}</small>
        </div>
        <form method="POST" action="{{ url_for('admin_delete_announcement', ann_id=ann.id) }}" onsubmit="return confirm('حذف الإعلان نهائياً؟')">
            <button class="btn btn-sm btn-danger" type="submit">حذف</button>
        </form>
    </div>
    {% else %}
    <div class="list-group-item text-muted">لا توجد إعلانات.</div>
    {% endfor %}
</div>
{% endblock %}
