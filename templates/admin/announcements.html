{% extends "admin/admin_base.html" %}
{% block admin_content %}
<h3>إدارة الإعلانات</h3>
<form method="POST">
    <input name="title" class="form-control mb-2" placeholder="العنوان" required>
    <textarea name="content" class="form-control mb-2" rows="4" placeholder="المحتوى"></textarea>
    <button class="btn btn-primary">إضافة إعلان</button>
</form>
<hr>
{% for ann in announcements %}
<div class="card mb-2">
    <div class="card-body">
        <h5>{{ ann.title }}</h5>
        <p>{{ ann.content }}</p>
        <a href="/admin/announcement/delete/{{ ann.id }}" class="btn btn-danger btn-sm">حذف</a>
    </div>
</div>
{% endfor %}
{% endblock %}
