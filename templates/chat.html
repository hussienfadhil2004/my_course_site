{% extends "base.html" %}
{% block content %}
<h3>الدردشة العامة</h3>
<div class="card">
    <div class="card-body" id="chat-box" style="height: 60vh; overflow-y: auto;"></div>
    <div class="card-footer">
        <div class="input-group">
            <input type="text" id="message-input" class="form-control" placeholder="اكتب رسالة...">
            <button class="btn btn-primary" id="send-btn">إرسال</button>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
<script>
const socket = io();
const chatBox = document.getElementById('chat-box');
const msgInput = document.getElementById('message-input');
const sendBtn = document.getElementById('send-btn');
const currentUserId = parseInt('{{ current_user.id }}');

socket.on('new_message', function(msg) {
    const div = document.createElement('div');
    if (msg.sender_id === currentUserId) {
        div.className = 'message sent';
    } else {
        div.className = 'message received';
    }
    div.innerHTML = '<strong>' + msg.sender_name + '</strong>: ' + msg.text + ' <small>' + msg.timestamp + '</small>';
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
});

function sendMessage() {
    const text = msgInput.value.trim();
    if (!text) return;
    socket.emit('send_message', { text: text });
    msgInput.value = '';
}

sendBtn.addEventListener('click', sendMessage);
msgInput.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') sendMessage();
});

fetch('/api/messages').then(function(r) { return r.json(); }).then(function(msgs) {
    chatBox.innerHTML = '';
    msgs.forEach(function(m) {
        const div = document.createElement('div');
        if (m.sender_id === currentUserId) {
            div.className = 'message sent';
        } else {
            div.className = 'message received';
        }
        div.innerHTML = '<strong>' + m.sender_name + '</strong>: ' + m.text + ' <small>' + m.timestamp + '</small>';
        chatBox.appendChild(div);
    });
    chatBox.scrollTop = chatBox.scrollHeight;
});
</script>
{% endblock %}
