{% extends "base.html" %}
{% block content %}
<div class="text-center py-5">
    <h1>💻 مرحباً بكم في دورة تعلم الحاسوب</h1>
    <p class="lead">تعلم أساسيات الحاسوب والبرامج المكتبية بطريقة ممتعة وتفاعلية</p>
    {% if current_user.is_authenticated %}
    <a href="/lessons" class="btn btn-success btn-lg m-2">📚 الدروس</a>
    <a href="/test" class="btn btn-warning btn-lg m-2">📝 اختبار</a>
    <a href="/statistics" class="btn btn-info btn-lg m-2">📊 إحصائياتي</a>
    <a href="/chat" class="btn btn-primary btn-lg m-2">💬 المحادثة</a>
    {% else %}
    <a href="/register" class="btn btn-primary btn-lg m-2">ابدأ الآن</a>
    <a href="/login" class="btn btn-outline-primary btn-lg m-2">تسجيل الدخول</a>
    {% endif %}
</div>
{% endblock %}
